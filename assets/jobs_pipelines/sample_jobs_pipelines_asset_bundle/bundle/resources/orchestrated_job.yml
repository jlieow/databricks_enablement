resources:
  jobs:
    # -----------------------------------------------------------------------
    # RESOURCE 5 - the ORCHESTRATED job: a job that drives a pipeline. This is
    # the canonical Lakeflow pattern - a job orchestrates a Declarative Pipeline
    # as one task in a larger DAG:
    #
    #   ingest_orders (spark_python)  writes orders_raw
    #        |
    #   run_pipeline  (pipeline_task) refreshes the pipeline -> customer_summary
    #        |
    #   summarize     (spark_python)  reads customer_summary -> customer_final
    #
    # The pipeline_task points at the pipeline defined in orchestrated_pipeline.yml
    # by its resource id, so the bundle wires the two together automatically.
    # -----------------------------------------------------------------------
    orchestrated_job:
      name: sample-orchestrated-job
      description: "Job that orchestrates a Lakeflow pipeline: ingest -> pipeline_task -> summarize"

      tasks:
        - task_key: ingest_orders
          spark_python_task:
            python_file: ../src/orchestrated/ingest_orders.py
            parameters:
              - "--catalog=${resources.catalogs.demo_catalog.name}"
              - "--schema=${resources.schemas.orchestrated_schema.name}"
          environment_key: default

        # The pipeline task triggers a full run of the pipeline defined in this
        # same bundle. It starts only after ingest_orders has written the input.
        - task_key: run_pipeline
          depends_on:
            - task_key: ingest_orders
          pipeline_task:
            pipeline_id: ${resources.pipelines.orchestrated_pipeline.id}

        - task_key: summarize
          depends_on:
            - task_key: run_pipeline
          spark_python_task:
            python_file: ../src/orchestrated/summarize.py
            parameters:
              - "--catalog=${resources.catalogs.demo_catalog.name}"
              - "--schema=${resources.schemas.orchestrated_schema.name}"
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "3"
